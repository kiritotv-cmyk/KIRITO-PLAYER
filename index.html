<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRITO PLAYER</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #000000;
            --neon-blue: #00f3ff;
            --panel-bg: #0a0a0a;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }
        
        /* TELA DE LOGIN */
        #login-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background: radial-gradient(circle at center, #001f24 0%, #000000 100%);
        }
        .logo { font-size: 2.5rem; font-weight: bold; color: var(--text-color); text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 2rem; text-align: center; }
        .login-box {
            background-color: var(--panel-bg); padding: 20px; border-radius: 10px;
            border: 1px solid #333; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333;
            background-color: #111; color: var(--text-color); outline: none;
        }
        .form-group input:focus { border-color: var(--neon-blue); box-shadow: 0 0 5px var(--neon-blue); }
        
        .btn {
            width: 100%; padding: 12px; background-color: transparent; color: var(--neon-blue);
            border: 2px solid var(--neon-blue); border-radius: 5px; font-weight: bold; font-size: 1rem;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn:hover, .btn:focus { background-color: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .error-msg { color: #ff3333; font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; }

        /* TELA DO APP (APÓS LOGIN) */
        #app-screen { display: none; height: 100vh; flex-direction: column; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background-color: var(--panel-bg); border-bottom: 2px solid var(--neon-blue);
        }
        .nav-tabs { display: flex; gap: 10px; overflow-x: auto; }
        .nav-btn {
            background: none; border: 1px solid #333; color: #fff; padding: 8px 15px;
            border-radius: 20px; cursor: pointer; white-space: nowrap;
        }
        .nav-btn:focus, .nav-btn.active { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 5px var(--neon-blue); outline: none; }
        
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .category-title { font-size: 1.2rem; color: var(--neon-blue); margin-bottom: 10px; text-shadow: 0 0 5px var(--neon-blue); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .card {
            background-color: var(--panel-bg); border: 1px solid #333; border-radius: 8px;
            overflow: hidden; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .card:focus, .card:hover { border-color: var(--neon-blue); transform: scale(1.05); outline: none; box-shadow: 0 0 10px rgba(0,243,255,0.3); }
        .card img { width: 100%; height: 150px; object-fit: cover; background-color: #222; }
        .card p { padding: 8px; font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* PLAYER DE VÍDEO */
        #player-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 1000; flex-direction: column;
        }
        video { flex: 1; width: 100%; height: 100%; background: #000; outline: none; }
        #close-player { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid var(--neon-blue); padding: 10px; border-radius: 5px; cursor: pointer; z-index: 1001;}
        #close-player:focus { background: var(--neon-blue); color: #000; outline: none; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">
        <div class="logo">KIRITO PLAYER</div>
        <div class="login-box">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('xtream')" id="tab-xtream">Xtream Codes</div>
                <div class="tab" onclick="switchTab('m3u')" id="tab-m3u">Lista M3U</div>
            </div>

            <!-- Form Xtream Codes -->
            <div id="form-xtream">
                <div class="form-group">
                    <label>Servidor / DNS (ex: http://servidor.com:8080)</label>
                    <input type="text" id="xc-server" placeholder="http://...">
                </div>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="xc-user">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="xc-pass">
                </div>
                <button class="btn" onclick="loginXtream()">Entrar</button>
            </div>

            <!-- Form M3U -->
            <div id="form-m3u" style="display: none;">
                <div class="form-group">
                    <label>URL da Lista M3U</label>
                    <input type="text" id="m3u-url" placeholder="http://...">
                </div>
                <div class="form-group">
                    <label>Ou carregar arquivo .m3u</label>
                    <input type="file" id="m3u-file" accept=".m3u">
                </div>
                <button class="btn" onclick="loginM3U()">Conectar</button>
            </div>

            <div class="error-msg" id="login-error">Erro de conexão. Verifique os dados.</div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="app-screen">
        <header>
            <div class="logo" style="font-size: 1.2rem; margin: 0;">KIRITO</div>
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="loadContent('live')" id="nav-live">TV ao Vivo</button>
                <button class="nav-btn" onclick="loadContent('movies')" id="nav-movies">Filmes</button>
                <button class="nav-btn" onclick="loadContent('series')" id="nav-series">Séries</button>
                <button class="nav-btn" onclick="logout()" style="border-color: #ff3333; color: #ff3333;">Sair</button>
            </div>
        </header>
        <main id="content-area">
            <!-- O conteúdo será injetado aqui via JavaScript -->
        </main>
    </div>

    <!-- PLAYER DE VÍDEO -->
    <div id="player-modal">
        <button id="close-player" onclick="closePlayer()">FECHAR [ESC]</button>
        <video id="video-player" controls autoplay></video>
    </div>

    <script>
        let currentApi = null; // 'xtream' ou 'm3u'
        let xtreamData = {}; // Salva dados do login temporariamente na memória
        let m3uData = []; // Salva lista M3U na memória

        // --- NAVEGAÇÃO DE ABAS NO LOGIN ---
        function switchTab(type) {
            document.getElementById('tab-xtream').classList.remove('active');
            document.getElementById('tab-m3u').classList.remove('active');
            document.getElementById('form-xtream').style.display = 'none';
            document.getElementById('form-m3u').style.display = 'none';
            document.getElementById('login-error').style.display = 'none';

            if(type === 'xtream') {
                document.getElementById('tab-xtream').classList.add('active');
                document.getElementById('form-xtream').style.display = 'block';
            } else {
                document.getElementById('tab-m3u').classList.add('active');
                document.getElementById('form-m3u').style.display = 'block';
            }
        }

        // --- LOGIN XTREAM CODES ---
        async function loginXtream() {
            const server = document.getElementById('xc-server').value.trim();
            const user = document.getElementById('xc-user').value.trim();
            const pass = document.getElementById('xc-pass').value.trim();

            if(!server || !user || !pass) {
                showError("Preencha todos os campos.");
                return;
            }

            try {
                // A API do Xtream usa esse endpoint para validar e puxar dados
                const url = `${server}/player_api.php?username=${user}&password=${pass}`;
                const response = await fetch(url);
                const data = await response.json();

                if(data.user_info && data.user_info.auth === 1) {
                    currentApi = 'xtream';
                    // Salva na memória da sessão (seguro, não fica no GitHub)
                    xtreamData = { server, user, pass };
                    sessionStorage.setItem('kirito_auth', JSON.stringify(xtreamData));
                    
                    showApp();
                } else {
                    showError("Usuário ou senha inválidos no servidor.");
                }
            } catch (err) {
                console.error(err);
                showError("Não foi possível conectar ao servidor. Verifique o DNS.");
            }
        }

        // --- LOGIN M3U (Preservado e Melhorado) ---
        function loginM3U() {
            const fileInput = document.getElementById('m3u-file');
            const urlInput = document.getElementById('m3u-url').value.trim();

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    parseM3U(e.target.result);
                };
                reader.readAsText(file);
            } else if (urlInput) {
                fetch(urlInput)
                    .then(res => res.text())
                    .then(text => parseM3U(text))
                    .catch(() => showError("Erro ao baixar a lista M3U. Verifique a URL."));
            } else {
                showError("Insira uma URL ou selecione um arquivo M3U.");
            }
        }

        function parseM3U(content) {
            try {
                const lines = content.split('\n');
                let parsed = [];
                let currentItem = {};

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,(.*)$/);
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        currentItem.name = nameMatch ? nameMatch[1] : "Sem Nome";
                        currentItem.logo = logoMatch ? logoMatch[1] : "";
                    } else if (line.startsWith('http')) {
                        currentItem.url = line;
                        if (currentItem.url) {
                            parsed.push({ ...currentItem });
                        }
                        currentItem = {}; // Reset
                    }
                }

                if (parsed.length === 0) throw new Error("Lista vazia");
                
                currentApi = 'm3u';
                m3uData = parsed;
                showApp();
            } catch (err) {
                showError("Arquivo M3U inválido.");
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('login-error');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        // --- MOSTRAR O APP APÓS LOGIN ---
        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            loadContent('live'); // Carrega a TV ao vivo por padrão
        }

        function logout() {
            sessionStorage.removeItem('kirito_auth');
            location.reload(); // Recarrega a página para limpar tudo
        }

        // --- CARREGAR CONTEÚDOS (TV, FILMES, SÉRIES) ---
        async function loadContent(type) {
            // Atualiza visual dos botões do menu
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById(`nav-${type}`)) document.getElementById(`nav-${type}`).classList.add('active');
            
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<p style="text-align:center; margin-top:20px;">Carregando...</p>';

            if (currentApi === 'xtream') {
                loadXtreamContent(type, contentArea);
            } else if (currentApi === 'm3u') {
                loadM3UContent(type, contentArea);
            }
        }

        async function loadXtreamContent(type, container) {
            const { server, user, pass } = xtreamData;
            let action = '';
            if(type === 'live') action = 'get_live_categories';
            if(type === 'movies') action = 'get_vod_categories';
            if(type === 'series') action = 'get_series_categories';

            try {
                const res = await fetch(`${server}/player_api.php?username=${user}&password=${pass}&action=${action}`);
                const categories = await res.json();
                
                container.innerHTML = ''; // Limpa
                // Exemplo simplificado: Vamos mostrar apenas as categorias
                // Em um app completo, ao clicar na categoria, faríamos outra chamada para puxar os canais/filmes
                categories.forEach(cat => {
                    const div = document.createElement('div');
                    div.className = 'category-title';
                    div.innerText = cat.category_name;
                    container.appendChild(div);
                    
                    const grid = document.createElement('div');
                    grid.className = 'grid';
                    // Aqui entraria a lógica de listar os itens da categoria.
                    // Para simplificar e mostrar que está funcionando, colocamos um card fake
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<p>${cat.category_name}</p>`;
                    grid.appendChild(card);
                    container.appendChild(grid);
                });

            } catch (err) {
                container.innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar dados. Verifique sua conexão.</p>';
            }
        }

        function loadM3UContent(type, container) {
            container.innerHTML = '';
            // Como a lista M3U é tudo junto, vamos separar por abas de forma simples aqui
            const grid = document.createElement('div');
            grid.className = 'grid';

            // Exibindo os primeiros 50 itens da lista M3U para teste
            m3uData.slice(0, 50).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.logo || 'https://via.placeholder.com/150x150/000000/00f3ff?text=TV'}" alt="Logo">
                    <p>${item.name}</p>
                `;
                card.onclick = () => playVideo(item.url);
                grid.appendChild(card);
            });

            const title = document.createElement('h2');
            title.innerText = type === 'live' ? 'Canais M3U' : 'Conteúdo M3U';
            title.style.color = 'var(--neon-blue)';
            container.appendChild(title);
            container.appendChild(grid);
        }

        // --- PLAYER DE VÍDEO REAL (HLS) ---
        function playVideo(url) {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-player');
            
            modal.style.display = 'flex';
            
            // Destrói player anterior se existir
            if (window.hls) {
                window.hls.destroy();
            }

            if (Hls.isSupported()) {
                window.hls = new Hls();
                window.hls.loadSource(url);
                window.hls.attachMedia(video);
                window.hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Fallback para Safari/iOS
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-player');
            video.pause();
            video.src = "";
            if (window.hls) {
                window.hls.destroy();
            }
            modal.style.display = 'none';
        }

        // Suporte a botão Voltar do controle remoto / teclado (ESC)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closePlayer();
            }
        });
    </script>
</body>
</html>
